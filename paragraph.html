<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raj Computer Center</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fff7db, #f9e9a8);
        color: #243b65;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(24px, 7vw, 60px);
        background: #fff;
        border: 1px solid #f0dfaa;
        border-radius: 20px;
        box-shadow: 0 18px 50px rgb(96 73 16 / 14%);
      }

      p {
        margin: 0;
        font-size: clamp(1.2rem, 4vw, 2rem);
        font-weight: 600;
      }

      p + p {
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid #eee5ca;
      }

      p:first-child {
        color: #758096;
      }

      p:nth-child(2) {
        color: #1d4c82;
        font-size: clamp(1.6rem, 6vw, 2.7rem);
        text-align: center;
      }

      p:last-child {
        color: #758096;
        font-size: 1rem;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <main>
      <p>welcome</p>
      <p>RAJ COMPUTER CENTER</p>
      <p>Thank you</p>
    </main>
  </body>
</html>
