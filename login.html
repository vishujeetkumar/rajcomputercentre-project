<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      /* Prevents 100% width inputs from overflowing the form box */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      form {
        background-color: #ffffff;
        width: 100%;
        max-width: 360px;
        padding: 32px 28px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      /* Hide <br> tags so CSS margins control spacing evenly */
      form br {
        display: none;
      }

      h3 {
        font-size: 1.6rem;
        margin-bottom: 6px;
        color: #1e3a8a;
        text-align: center;
      }

      p {
        margin-bottom: 24px;
        color: #6b7280;
        font-size: 0.92rem;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #374151;
        font-size: 0.9rem;
        font-weight: 600;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 18px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background-color: #f9fafb;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #2563eb;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      /* Styled Login Button */
      input[type="submit"] {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        background-color: #2563eb;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="submit"]:hover {
        background-color: #1d4ed8;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      }
    </style>
  </head>
  <body>
    <form action="login.html" method="post">
      <h3>Login</h3>
      <p>Welcome Back Dear</p>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required /><br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      /><br /><br />

      <input type="submit" value="Login" />
    </form>
  </body>
</html>
