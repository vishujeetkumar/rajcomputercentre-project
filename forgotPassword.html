<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #edf3ff, #f7f0f4);
            color: #263449;
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.5;
        }
        header,
        form {
            width: min(100%, 480px);
            background: #fff;
        }
        header {
            padding: 28px 32px 8px;
            border-radius: 16px 16px 0 0;
        }
        header h1,
        header h3 {
            color: #234b82;
            font-size: 1.7rem;
        }
        form {
            padding: 16px 32px 28px;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 18px 45px rgb(35 59 94 / 12%);
        }
        fieldset {
            padding: 0;
            border: 0;
        }
        fieldset p {
            margin-bottom: 20px;
            color: #69778a;
        }
        label {
            display: block;
            margin: 14px 0 6px;
            color: #34445b;
            font-size: 0.9rem;
            font-weight: 600;
        }
        input[type="email"],
        input[type="tel"],
        input[type="date"] {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fbfcfe;
            color: #263449;
            font: inherit;
        }
        input:focus {
            border-color: #3569b7;
            outline: 3px solid rgb(53 105 183 / 16%);
        }
        form br {
            display: none;
        }
        a {
            display: inline-block;
            margin: 20px 18px 18px 0;
            color: #285da7;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        input[type="reset"],
        input[type="submit"] {
            min-height: 44px;
            margin: 4px 8px 0 0;
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }
        input[type="submit"] {
            background: #285da7;
            color: #fff;
        }
        input[type="submit"]:hover {
            background: #1e4b8a;
        }
        input[type="reset"] {
            background: #eef1f5;
            color: #3d4c60;
        }
        input[type="reset"]:hover {
            background: #e1e6ed;
        }
        div{
            margin-left:30% ;
        }
        footer {
            width: min(100%, 480px);
            padding: 18px 12px 0;
            color: #6c7788;
            font-size: 0.85rem;
            text-align: center;
        }
        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }
            header {
                padding: 24px 22px 8px;
            }
            form {
                padding: 16px 22px 24px;
            }
            input[type="reset"],
            input[type="submit"] {
                width: 100%;
                margin: 6px 0 0;
            }
        }
    </style>
  </head>
  <body>
    <header>
    <h3>Forgot Password</h3>
    </header>
    <form action="forgotPassword.html">
      <fieldset>
        <p>Enter Your following details</p>
        <label for="email">EMAIL ID : </label>
        <input type="email" id="email" name="email" required />
        <br />
        <label for="Phone">Phone NO.</label>
        <input type="tel" name="phone" id="phone" maxlength="10" min="0" max="9" pattern="[0-9]" /><br />
        <label for="dob">D.O.B :</label>
        <input type="date" id="dob" name="dob" required /><br />
        <div>
        <a href="login.html">Login</a><a href="register.html">New User</a></div>
        <div>
        <input type="reset" name="reset" id="reset" />
        <input type="submit" name="" id="submit" name="submit" /></div>
      </fieldset>
    </form>
    <footer>
        Developed By Vishujeet Kumar
    </footer>
  </body>
</html>
