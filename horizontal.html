<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume | Vishujeet Kumar</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 16px;
        display: grid;
        place-items: center;
        background: #eef2f7;
        color: #273449;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(24px, 6vw, 48px);
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgb(24 39 75 / 12%);
      }

      h1 {
        margin: 0;
        color: #1d3557;
        font-size: clamp(2rem, 7vw, 3rem);
        letter-spacing: 0.1em;
        text-align: center;
      }

      .accent {
        width: 72px;
        height: 4px;
        margin: 18px auto 30px;
        background: #e76f51;
        border: 0;
        border-radius: 99px;
      }

      .details {
        display: grid;
        gap: 18px;
      }

      .detail {
        padding-bottom: 12px;
        border-bottom: 1px solid #e5eaf0;
      }

      .detail span {
        display: block;
        margin-bottom: 4px;
        color: #69778b;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .signature {
        margin-top: 42px;
        color: #69778b;
        font-style: italic;
        text-align: right;
      }

      .signature-line {
        width: 120px;
        margin: 8px 0 0 auto;
        border: 0;
        border-top: 1px solid #aeb9c7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Resume</h1>
      <hr class="accent" />
      <div class="details">
        <div class="detail"><span>Name</span>Vishujeet Kumar</div>
        <div class="detail"><span>Course</span>ADCA</div>
        <div class="detail"><span>Center</span>Raj Computer</div>
      </div>
      <div class="signature">
        Signature
        <hr class="signature-line" />
      </div>
    </main>
  </body>
</html>
